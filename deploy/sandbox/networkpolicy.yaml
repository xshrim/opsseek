# Default deny: custom Skill Jobs have no network path unless the deployment
# supplies a narrowly scoped, separately reviewed egress policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opsseek-sandbox-default-deny-egress
  namespace: opsseek
spec:
  podSelector:
    matchLabels:
      opsseek.io/sandbox: "true"
  policyTypes:
    - Egress
  egress: []
